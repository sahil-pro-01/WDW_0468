<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Table</title>
</head>
<body>
    <table text-align: center="1" cellspacing="0" cellpadding="10" Border="n">
        <tr>
            <th>Day</th>
            <th>Lab Batches</th>
            <th>Faculty</th>
            <th>Room</th>
            <th>Time</th>
        </tr>
        <tr>
            <td>Friday</td>
            <td>
                <table class="Nested" Border="n" cellspacing="0" cellpadding="10">
                    <tr>
                        <th>Batch</th>
                        <th>System</th>
                    </tr>
                    <tr>
                        <td>A1</td>
                        <td>PC 1-20</td>
                    </tr> 
                    <tr>
                        <td>A2</td>
                        <td>PC 21-40</td>
                    </tr> 
                </table>
            </td>
            <td>Dr. Sharma</td>
            <td>Lab 2</td>
            <td>2-4 Pm</td>
        </tr>
    </table>
</body>
</html>
