<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table with Headers,Caption and Footer</title>
</head>
<body>
    <table text-align: center="1" cellspacing="0" cellpadding="10" Border="n">
        <caption>Student Marks</caption>
        <thread>
            <tr>
                <th>Roll</th>
                <th>Name</th>
                <th>Marks</th>
            </tr>
        </thread>
        <tr>
            <th>1</th>
            <th>Aman</th>
            <th>85</th>
        </tr>
        <tr>
            <th>2</th>
            <th>Riya</th>
            <th>92</th>
        </tr>
        <tr>
            <th colspan="2">Average</th>
            <th>88.5</th>
        </tr>
        
</body>
</html>
