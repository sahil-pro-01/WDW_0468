<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Attributes and Input Validation</title>
</head>
<body>
    <p>
        <input type="text" placeholder="Full name"required>
    </p>
    <p>
        <input type="email" placeholder="you@college.edu"required> 
    </p>
    <p>
        <input type="tel" maxlength="10" placeholder="10-digit mobile"required>
    </p>
    <p>
        <input type="text" min="6" placeholder="Min 6 character"required>
    </p>    
    <p>
        <input type="number" min="17" max="30"  placeholder="Age(17)" required> 
    <p>
        <button type="submit">Register</button>
    </p>
</body>
</html>
