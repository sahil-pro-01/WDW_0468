<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rowspan and Colspan(Timetable)</title>
</head>
<body>
    <table text-align: center="1" cellspacing="0" cellpadding="10" Border="n">
        <caption><b>Weekly Timetable</b></caption>
        <thread>
            <tr>
            <th>Day</th>
            <th>9-10</th>
            <th>10-11</th>
            <th>11-12</th>
            </tr>
        </thread>
        <tr>
            <td>Mon</td>
            <td>Maths</td>
            <td>HTML</td>
            <td rowspan="2" style="text-align:center;">Web Lab</td>
        </tr> 
        <tr>
            <td>Tue</td>
            <td>DBMS</td>
            <td>OS</td>
        </tr>
        <tr>
            <td>Wed</td>
            <td colspan="3" style="text-align:center;">Seminar</td> <!--Seminar text centre nhi hua-->
        </tr> 
    </table>
</body>
</html>
