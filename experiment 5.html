<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1 style="text-align: center;">Student Registration Form</h1><hr>
     <form action="#" method="post" align="center">
    <p>
        <b>
        <label for="Full name">Full name:</label>
        <input type="text" id="Full name" name="Full name" placeholder="Enter your Full name" required>
        </b>
    </p>
    <p>
        <b>
        <label for="Email">Email:</label>
        <input type="email" id="Email" name="Email" placeholder="Enter valid email address" required>
        </b>
    </p>
    <p>
        <b>
        <label for="Password">Password:</label>
        <input type="password" id="Password" name="Password" placeholder="Enter password" required>
        </b>
    </p>
    <p>
        <b>
        <label for="Gender">Gender:</label>
        <input type="radio" id="male" name="Gender" value="Male"required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="Gender" value="Female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="Gender" value="Other">
        <label for="other">Other</label>
        </b>
    </p>
    <p>
        <b>
        <label for="Course">Course:</label>
        <select id="course" name="course" required>
            <option value="">--Select a Course--</option>
            <option value="B.Tech"> B.Tech</option>
            <option value="B.Sc">B.Sc</option>
            <option value="BCA">BCA</option>
        </select>
        </b>
    </p>
    
    <p>
        <b>
        <label for="Contact No.">Contact No.:</label>
        <input type="tel" name="Contact No." placeholder="Enter mobile no."required >
        </b>
    </p>
    <p>
        <b>
        <label for="Address">Address:</label><br>
        <textarea name="Address" row="4" col="50" placeholder="Enter Your Address" required></textarea>
        </b>
    </p>
    <p>
        <input type="submit" value="Register">
        <input type="reset" value="Cancel">
    </p>
    <hr>
    <p style="text-align: center;"> &COPY; 2026 Student Registration Portal</p>

</body>
</html>
